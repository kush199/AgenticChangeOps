name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      # The runner image ships newer SDKs, and `dotnet --version` reports the newest one. A
      # global.json created here (never committed, so local builds are unaffected) makes the
      # installed 8.0.x SDK the one every later step uses.
      - name: Select .NET 8 SDK
        run: |
          printf '%s\n' '{ "sdk": { "version": "8.0.100", "rollForward": "latestFeature" } }' > global.json

      - name: Require .NET 8
        run: |
          v="$(dotnet --version)"
          echo "dotnet SDK $v"
          case "$v" in
            8.*) ;;
            *) echo "expected a .NET 8 SDK, got $v"; exit 1 ;;
          esac

      - name: Restore
        run: dotnet restore AgenticChangeOps.sln

      - name: Build
        run: dotnet build AgenticChangeOps.sln --no-restore -c Release

      - name: Test
        run: >-
          dotnet test AgenticChangeOps.sln --no-build -c Release
          --logger "trx"
          --logger "console;verbosity=normal"
          --results-directory ./TestResults

      - name: Require executed tests
        run: |
          files="$(find TestResults -name '*.trx' 2>/dev/null || true)"
          if [ -z "$files" ]; then
            echo "no test result files were produced"
            exit 1
          fi
          n="$(grep -ho 'executed="[0-9]*"' $files | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')"
          echo "executed tests: $n"
          if [ "$n" -le 0 ]; then
            echo "no test was executed"
            exit 1
          fi

      - name: Summarise
        if: always()
        run: |
          files="$(find TestResults -name '*.trx' 2>/dev/null || true)"
          if [ -z "$files" ]; then
            echo "Executed tests: no result files" >> "$GITHUB_STEP_SUMMARY"
          else
            n="$(grep -ho 'executed="[0-9]*"' $files | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')"
            echo "Executed tests: $n" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: TestResults/**/*.trx
          retention-days: 30
          if-no-files-found: warn
